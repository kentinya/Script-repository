name: Build CodeCompareTool v5.2 EXE

on:
  push:
    branches:
      - build/codecompare-v5.2-exe-20260911
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore source files
        shell: powershell
        run: |
          $core = (Get-ChildItem "codecompare-build/core_*.b64" | Sort-Object Name | ForEach-Object { Get-Content -Raw $_.FullName }) -join ""
          $gui = (Get-ChildItem "codecompare-build/gui_*.b64" | Sort-Object Name | ForEach-Object { Get-Content -Raw $_.FullName }) -join ""
          $report = (Get-ChildItem "codecompare-build/report_*.b64" | Sort-Object Name | ForEach-Object { Get-Content -Raw $_.FullName }) -join ""
          [IO.File]::WriteAllBytes("code_compare_core.py", [Convert]::FromBase64String($core))
          [IO.File]::WriteAllBytes("code_compare_gui.py", [Convert]::FromBase64String($gui))
          [IO.File]::WriteAllBytes("report_export.py", [Convert]::FromBase64String($report))

      - name: Verify restored source
        run: python -m py_compile code_compare_core.py code_compare_gui.py report_export.py

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CodeCompareTool --hidden-import openpyxl --collect-all openpyxl code_compare_gui.py

      - name: Verify PE executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\CodeCompareTool.exe")) { throw "EXE not generated" }
          $bytes = [IO.File]::ReadAllBytes("dist\CodeCompareTool.exe")
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows PE/MZ executable" }
          Write-Host "EXE size: $((Get-Item 'dist\CodeCompareTool.exe').Length) bytes"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CodeCompareTool_v5.2_Windows_x64
          path: dist/CodeCompareTool.exe
          if-no-files-found: error
          retention-days: 7
