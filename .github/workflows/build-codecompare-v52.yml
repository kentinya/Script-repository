name: Build CodeCompareTool v5.2 EXE

on:
  push:
    branches:
      - build/codecompare-v5.2-exe-20260911
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore source files
        shell: powershell
        run: |
          $gui2 = (Get-ChildItem "codecompare-build/gui2fix_*.b64" | Sort-Object Name | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ""
          [IO.File]::WriteAllText("codecompare-build/gui_02.b64", $gui2, [Text.Encoding]::ASCII)

          function Restore-Chunks($pattern, $output) {
            $stream = New-Object System.IO.MemoryStream
            Get-ChildItem $pattern | Sort-Object Name | ForEach-Object {
              $encoded = (Get-Content -Raw $_.FullName).Trim()
              $bytes = [Convert]::FromBase64String($encoded)
              $stream.Write($bytes, 0, $bytes.Length)
            }
            [IO.File]::WriteAllBytes($output, $stream.ToArray())
            $stream.Dispose()
          }
          Restore-Chunks "codecompare-build/core_*.b64" "code_compare_core.py"
          Restore-Chunks "codecompare-build/gui_*.b64" "code_compare_gui.py"
          Restore-Chunks "codecompare-build/report_*.b64" "report_export.py"

      - name: Verify exact source hashes
        shell: powershell
        run: |
          $expected = @{
            "code_compare_core.py" = "3179912b652530a1f38bd513ba5c64b0158d1ec4fdbdb44bcabcf41e37572690"
            "code_compare_gui.py" = "06269cc6dd0060ddc9c14b3fb7134c88ae66fb92a3c0a08265100247be28388e"
            "report_export.py" = "6cc12ce1761d916aedc89d978c872db493dc4a063e176a0d393ec279641216fb"
          }
          $bad = $false
          foreach ($f in $expected.Keys) {
            $actual = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            Write-Host "$f : $actual"
            if ($actual -ne $expected[$f]) {
              Write-Host "HASH MISMATCH: expected $($expected[$f])"
              $bad = $true
            }
          }
          if ($bad) { throw "Restored source differs from validated local v5.2 source" }

      - name: Verify Python syntax
        run: python -m py_compile code_compare_core.py code_compare_gui.py report_export.py

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CodeCompareTool --hidden-import openpyxl --collect-all openpyxl code_compare_gui.py

      - name: Verify PE executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\CodeCompareTool.exe")) { throw "EXE not generated" }
          $bytes = [IO.File]::ReadAllBytes("dist\CodeCompareTool.exe")
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows PE/MZ executable" }
          Write-Host "EXE size: $((Get-Item 'dist\CodeCompareTool.exe').Length) bytes"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CodeCompareTool_v5.2_Windows_x64
          path: dist/CodeCompareTool.exe
          if-no-files-found: error
          retention-days: 7
