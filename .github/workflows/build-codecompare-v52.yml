name: Build CodeCompareTool v5.4 EXE

on:
  push:
    branches:
      - build/codecompare-v5.2-exe-20260911
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore source files
        shell: powershell
        run: |
          $g00 = ((Get-Content -Raw "codecompare-build/g2fix00a.b64").Trim()) + ((Get-Content -Raw "codecompare-build/g2fix00b.b64").Trim())
          $g04 = ((Get-Content -Raw "codecompare-build/g2fix04a.b64").Trim()) + ((Get-Content -Raw "codecompare-build/g2fix04b.b64").Trim())
          $g05 = ((Get-Content -Raw "codecompare-build/g2fix05a.b64").Trim()) + ((Get-Content -Raw "codecompare-build/g2fix05b.b64").Trim())
          [IO.File]::WriteAllText("codecompare-build/gui2fix_00.b64", $g00, [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText("codecompare-build/gui2fix_04.b64", $g04, [Text.Encoding]::ASCII)
          [IO.File]::WriteAllText("codecompare-build/gui2fix_05.b64", $g05, [Text.Encoding]::ASCII)
          $gui2 = (Get-ChildItem "codecompare-build/gui2fix_*.b64" | Sort-Object Name | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ""
          [IO.File]::WriteAllText("codecompare-build/gui_02.b64", $gui2, [Text.Encoding]::ASCII)
          function Restore-Chunks($pattern, $output) {
            $stream = New-Object System.IO.MemoryStream
            Get-ChildItem $pattern | Sort-Object Name | ForEach-Object {
              $encoded = (Get-Content -Raw $_.FullName).Trim()
              $bytes = [Convert]::FromBase64String($encoded)
              $stream.Write($bytes, 0, $bytes.Length)
            }
            [IO.File]::WriteAllBytes($output, $stream.ToArray())
            $stream.Dispose()
          }
          Restore-Chunks "codecompare-build/core_*.b64" "code_compare_core.py"
          Restore-Chunks "codecompare-build/gui_*.b64" "code_compare_gui.py"
          Restore-Chunks "codecompare-build/report_*.b64" "report_export.py"

      - name: Repair known GUI transfer corruption
        shell: powershell
        run: |
          python -c "from pathlib import Path; p=Path('code_compare_gui.py'); s=p.read_bytes().decode('utf-8',errors='replace'); s=s.replace(chr(0xfffd)+'}'+chr(0x65e7)+chr(0x7248)+chr(0x672c), chr(0x4ec5)+chr(0x65e7)+chr(0x7248)+chr(0x672c)); p.write_text(s,encoding='utf-8',newline='')"

      - name: Apply v5.3 flexible file matching
        run: python codecompare-build/patch_v53.py

      - name: Apply v5.4 progress and performance patch
        shell: powershell
        run: |
          python -c "from pathlib import Path; import base64,gzip; files=sorted(Path('codecompare-build').glob('v54script_*.b64')); data=''.join(p.read_text(encoding='ascii').strip() for p in files); raw=gzip.decompress(base64.b64decode(data)); Path('patch_v54.py').write_bytes(raw); print('script bytes',len(raw))"
          python patch_v54.py

      - name: Verify Python syntax
        run: python -m py_compile code_compare_core.py code_compare_gui.py report_export.py

      - name: Smoke test nested matching and progress
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test_left\B | Out-Null
          New-Item -ItemType Directory -Force test_right | Out-Null
          Set-Content -Encoding ascii test_left\B\B.c "int x = 1;"
          Set-Content -Encoding ascii test_right\B.c "int x = 2;"
          python -c "from pathlib import Path; from code_compare_core import compare_directories; e=[]; r=compare_directories(Path('test_left'),Path('test_right'),progress_callback=lambda *x:e.append(x)); assert len(r)==1 and r[0].left_path and r[0].right_path and r[0].status=='MODIFIED'; assert any(x[0]=='compare' for x in e) and e[-1][0]=='done'; print(r[0].relative_path, e[-1])"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Build Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CodeCompareTool --hidden-import openpyxl --collect-all openpyxl code_compare_gui.py

      - name: Verify PE executable
        shell: powershell
        run: |
          if (!(Test-Path "dist\CodeCompareTool.exe")) { throw "EXE not generated" }
          $bytes = [IO.File]::ReadAllBytes("dist\CodeCompareTool.exe")
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows PE/MZ executable" }
          Write-Host "EXE size: $((Get-Item 'dist\CodeCompareTool.exe').Length) bytes"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CodeCompareTool_v5.4_Windows_x64
          path: dist/CodeCompareTool.exe
          if-no-files-found: error
          retention-days: 7
