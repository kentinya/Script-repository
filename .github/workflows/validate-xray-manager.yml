name: Validate Xray Manager

on:
  pull_request:
    paths:
      - xray-manager.sh
      - .github/workflows/validate-xray-manager.yml
  push:
    paths:
      - xray-manager.sh

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash and help
        run: |
          bash -n xray-manager.sh
          bash xray-manager.sh help | grep -F 'quota-set'
      - name: Compile embedded Python here-docs
        run: |
          python3 - <<'PY'
          import pathlib,re
          source=pathlib.Path('xray-manager.sh').read_text()
          parts=list(re.finditer(r"<<'(?P<tag>PY[A-Z0-9_]*)'\s*\n(?P<body>.*?)\n(?P=tag)(?=\n|$)",source,re.S))
          assert len(parts)>=10, f'unexpected Python heredoc count: {len(parts)}'
          for match in parts:
              compile(match.group('body'),f"xray-manager.sh:{match.group('tag')}",'exec')
          print(f'Validated {len(parts)} embedded Python snippets')
          PY
