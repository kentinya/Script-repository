name: Validate Xray Manager

on:
  pull_request:
    paths:
      - 'xray/**'
      - '.github/workflows/validate-xray-manager.yml'
  push:
    paths:
      - 'xray/**'
      - '.github/workflows/validate-xray-manager.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash and help
        run: |
          bash -n xray/xray-manager.sh
          bash xray/xray-manager.sh help | grep -F 'quota-set'
      - name: Compile embedded Python here-docs
        run: |
          python3 - <<'PY'
          import pathlib,re
          source=pathlib.Path('xray/xray-manager.sh').read_text()
          parts=list(re.finditer(r"<<'(?P<tag>PY[A-Z0-9_]*)'\s*\n(?P<body>.*?)\n(?P=tag)(?=\n|$)",source,re.S))
          assert len(parts)>=10, f'unexpected Python heredoc count: {len(parts)}'
          for match in parts:
              compile(match.group('body'),f"xray/xray-manager.sh:{match.group('tag')}",'exec')
          print(f'Validated {len(parts)} embedded Python snippets')
          PY
      - name: Test REALITY TLS 1.3 detection
        run: python3 xray/tests/check-reality-tls.py
      - name: Test random REALITY target fallback
        run: bash xray/tests/check-reality-selection.sh
      - name: Test generated quota configuration
        run: bash xray/tests/check-node-quota.sh
